# Release del tema: al push di un tag "vX.Y.Z" compila CSS/JS, crea lo zip pulito (cartella starter-theme/) e lo allega alla release.
# I siti con il tema installato vedono la nuova versione nella notifica di aggiornamento di WordPress (inc/updater.php).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Il tag deve coincidere con Version in style.css
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n1 | tr -d '\r')"
          if [ "$tag" != "$ver" ]; then
            echo "Il tag $GITHUB_REF_NAME non coincide con Version: $ver in style.css"
            exit 1
          fi

      - name: Compila CSS e JS
        run: |
          npm ci
          npm run build

      - name: Crea lo zip pulito
        run: |
          mkdir -p dist-zip/starter-theme
          rsync -a \
            --include='docs/' --include='docs/GUIDA-FUNZIONI-STARTER-THEME.pdf' --exclude='docs/*' \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='README.md' --exclude='.claude/' --exclude='.DS_Store' \
            --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='tools/' \
            --exclude='dist-zip/' --exclude='images/demo-video-*.mp4' --exclude='*.bak*' --exclude='*.orig' --exclude='*.map' --exclude='*.log' \
            ./ dist-zip/starter-theme/
          (cd dist-zip && zip -qr starter-theme.zip starter-theme)

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-zip/starter-theme.zip --title "Starter Theme ${GITHUB_REF_NAME#v}" --generate-notes
